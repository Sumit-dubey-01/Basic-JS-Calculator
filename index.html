<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="theme1">

  <div class="calculator">
    <h1>Calculator</h1>

    <input type="text" id="result" readonly />

    <div class="buttons">
      <button data-value="C" class="operator">C</button>
      <button data-value="⌫" class="operator">⌫</button>
      <button data-value="=" class="operator">=</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="+" class="operator">+</button>

      <button data-value="3">3</button>
      <button data-value="4">4</button>
      <button data-value="-" class="operator">−</button>

      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="*" class="operator">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="/" class="operator">÷</button>

      <button data-value="9">9</button>
      <button data-value="0">0</button>
      <button data-value="%" class="operator">%</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("result");
    const buttons = document.querySelectorAll("button");

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        const value = btn.dataset.value;

        if (value === "C") display.value = "";
        else if (value === "⌫") display.value = display.value.slice(0, -1);
        else if (value === "=") {
          try {
            display.value = eval(display.value);
          } catch {
            display.value = "Error";
          }
        } else {
          display.value += value;
        }
      });
    });

    const themes = ["theme1", "theme2", "theme3"];
    let index = 0;

    setInterval(() => {
      document.body.classList.remove(...themes);
      document.body.classList.add(themes[index]);
      index = (index + 1) % themes.length;
    }, 8000);
  </script>

</body>
</html>
